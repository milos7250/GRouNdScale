; Configuration of the variant a-upstream of arabidopsis-ablation: the original implementation (upstream/) with the
; settings of causal_gan.cfg, in the original config format (no environment interpolation, no `compile modules`).
; profile-memory-upstream.py fills in the placeholders written as a dollar sign and a braced name from the environment
; (OUT_DIR, DATA_DIR, CAUSAL_GRAPH, NUM_GENES) and writes the result to the output directory.

[EXPERIMENT]
output directory = results/a-upstream
device = cuda
checkpoint ; set value to use a trained model
random seed = 07122309

    [Preprocessing]
    library size = 1000 ; library size used for library-size normalization

    [Data]
    train = data-upstream/train.h5ad
    validation = data-upstream/validation.h5ad
    test = data-upstream/test.h5ad
    number of genes = 1000
    causal graph = data/causal_graph.pkl

    [Model]
    type = causal GAN
    noise per gene = 1
    depth per gene = 3
    width per gene = 2
    critic layers = 752 368 176
    labeler layers = 992 496 256
    latent dim = 64 ; noise vector dimensions
    lambda = 12 ; regularization hyper-parameter for gradient penalty

    [Training]
    batch size = 2350
    critic iterations = 20 ; iterations to train the critic for each iteration of the generator
    maximum steps = 20
    labeler and antilabeler training intervals = 3

        [Optimizer]
        beta1 = 0.6994357370770018
        beta2 = 0.9290279002681272

        [Learning Rate]
        generator initial = 0.0025963598056598118
        generator final = 1e-5
        critic initial = 0.004832132757717026
        critic final = 1e-5
        labeler = 0.0005522848575802129
        antilabeler = 0.0008573871001347974

        [Logging]
        ; Nothing is logged or saved within the 20 steps
        summary frequency = 5000
        plot frequency = 10000
        save frequency = 10000

    [CC Model]
    type = GAN ; Non-conditional single-cell RNA-seq GAN (the causal controller)
    generator layers = 224 752 912
    critic layers = 816 384 192
    latent dim = 64 ; noise vector dimensions
    lambda = 20 ; regularization hyper-parameter for gradient penalty

    [CC Training]
    batch size = 358
    critic iterations = 8 ; iterations to train the critic for each iteration of the generator
    maximum steps = 20

        [CC Optimizer]
        beta1 = 0.746889719002457
        beta2 = 0.935351835545398

        [CC Learning Rate]
        generator initial = 0.02489116286890056
        generator final = 1e-6
        critic initial = 0.042469267252079085
        critic final = 1e-6

        [CC Logging]
        ; The controller is saved at its last step, the generator phase loads that checkpoint
        summary frequency = 5000
        plot frequency = 50000
        save frequency = 20
