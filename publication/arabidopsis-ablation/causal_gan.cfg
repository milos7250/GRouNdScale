; Configuration of the variants b-dense, c-eager and d-compiled of arabidopsis-ablation: the paper's Arabidopsis
; configuration (paper-arabidopsis: causal GAN trial 2, causal controller from GAN trial 56) with 20 steps per phase.
;
; Paths are relative to this directory, from which run.sh starts the jobs. Values written as ${NAME} come from the
; environment, set by run.sh or by profile-memory.py:
;   OUT_DIR           output directory of one run (set by run.sh)
;   DATA_DIR          data/ with the links to paper-arabidopsis/data (set by run.sh)
;   CAUSAL_GRAPH      the causal graph in DATA_DIR (set by run.sh)
;   COMPILE_MODULES   True for d-compiled, False for b-dense and c-eager (set by run.sh)
;   NUM_GENES         number of columns of the training data, 1000 (derived by profile-memory.py)
; F = 422, G = 578 and k = 15 are the properties of the causal graph.

[EXPERIMENT]
output directory = ${OUT_DIR}
device = cuda
checkpoint ; set value to use a trained model
random seed = 07122309
compile modules = ${COMPILE_MODULES}

    [Preprocessing]
    library size = 1_000 ; library size used for library-size normalization

    [Data]
    train = ${DATA_DIR}/train.h5ad
    validation = ${DATA_DIR}/validation.h5ad
    test = ${DATA_DIR}/test.h5ad
    number of genes = ${NUM_GENES}
    causal graph = ${CAUSAL_GRAPH}

    [Model]
    type = causal GAN
    noise per gene = 1
    depth per gene = 3
    width per gene = 2
    critic layers = 752 368 176
    labeler layers = 992 496 256
    latent dim = 64 ; noise vector dimensions
    lambda = 12 ; regularization hyper-parameter for gradient penalty


    [Training]
    batch size = 2350
    critic iterations = 20 ; iterations to train the critic for each iteration of the generator
    maximum steps = 20
    labeler and antilabeler training intervals = 3

        [Optimizer]
        ; coefficients used for computing running averages of gradient and its square
        beta1 = 0.6994357370770018
        beta2 = 0.9290279002681272

        [Learning Rate]
        generator initial = 0.0025963598056598118
        generator final = 1e-5
        critic initial = 0.004832132757717026
        critic final = 1e-5
        labeler = 0.0005522848575802129
        antilabeler = 0.0008573871001347974


        [Logging]
        ; Evaluation hooks only run at the last step, after the measured window has closed.
        summary frequency = 5_000
        plot frequency = 10_000
        save frequency = 10_000
        rf auroc frequency = 5_000

    [CC Model]
    type = GAN ; Non-conditional single-cell RNA-seq GAN (the causal controller)
    generator layers = 224 752 912
    critic layers = 816 384 192
    latent dim = 64 ; noise vector dimensions
    lambda = 20 ; regularization hyper-parameter for gradient penalty


    [CC Training]
    batch size = 358
    critic iterations = 8 ; iterations to train the critic for each iteration of the generator
    maximum steps = 20

        [CC Optimizer]
        ; coefficients used for computing running averages of gradient and its square
        beta1 = 0.746889719002457
        beta2 = 0.935351835545398

        [CC Learning Rate]
        generator initial = 0.02489116286890056
        generator final = 1e-6
        critic initial = 0.042469267252079085
        critic final = 1e-6

        [CC Logging]
        ; The controller is saved at its last step, the generator phase loads that checkpoint
        summary frequency = 5_000
        plot frequency = 50_000
        save frequency = 20
        rf auroc frequency = 5_000
