[EXPERIMENT]
run name = causal-gan-eval-trial2
output directory = causal-gan-eval-trial2
data directory = data
device ; we will let the program choose what is available
use DDP = False ; set to True to use DDP
checkpoint = causal-gan/2/checkpoints/step_500000.pth ; set value to use a trained model
random seed = 07122309  ; cannot set random seed for hyperopt

    [Preprocessing]
    10x = False
    raw = ${EXPERIMENT:data directory}/Col0_0h_scVI.h5ad
    validation set size = 10326
    test set size = 10326
    annotations
    min cells = 3 ; genes expressed in less than 3 cells are discarded
    min genes = 10 ; cells with less than 10 genes expressed are discarded
    library size = 1_000 ; library size used for library-size normalization
    louvain res = 0.15 ; Louvain clustering resolution (higher resolution means finding more and smaller clusters)
    highly variable number = 1_000 ; number of highly variable genes to identify

    [GRN Preparation]
    TFs ; no TFs in this config
    k = 15 ; k is the number of top most important TFs per gene to include in the GRN
    Inferred GRN = ${EXPERIMENT:data directory}/inferred_grnboost2.csv
    strategy = top
    include genes with no regulators = True

    [Data]
    train = ${EXPERIMENT:data directory}/Col0_0h_scVI_train.h5ad
    validation = ${EXPERIMENT:data directory}/Col0_0h_scVI_val.h5ad
    test = ${EXPERIMENT:data directory}/Col0_0h_scVI_test.h5ad
    number of genes = 1_000
    causal graph = ${EXPERIMENT:data directory}/causal_graph.pkl

    [Model]
    type = causal GAN
    noise per gene = 1
    depth per gene = 3
    width per gene = 2
    critic layers = 752 368 176
    labeler layers = 992 496 256
    latent dim = 64
    lambda = 12

    [Training]
    maximum steps = 500_000
    batch size = 2350
    critic iterations = 20
    labeler and antilabeler training intervals = 3

        [Optimizer]
        beta1
        beta2

        [Learning Rate]
        generator initial
        generator final = 1e-5
        critic initial
        critic final = 1e-5
        labeler
        antilabeler

        [Logging]
        summary frequency = 5_000
        plot frequency = 10_000
        save frequency = 100_000
        rf auroc frequency = 10_000

    ; Hyperparameters to optimize with Optuna, each entry can specify multiple ranges, numbers are read in pairs as a minimum and maximum value
    ; If lower and upper bounds are equal, that value is used without hyperparameter optimization
    [Hyperparameter Optimization]
    number of trials = 20  ; this is number of *successful* trials, pruned trials do not count here
    storage = postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PGHOST}:${PGPORT}/${POSTGRES_DB} ; default is a local sqlite database in the output directory
    study name = ${EXPERIMENT:run name} ; default is optuna_gan_study for GANs, optuna_causalgan_study for CausalGANs
    worker id environment variable = SLURM_ARRAY_TASK_ID ; environment variable to use for worker identification in distributed hyperparameter optimization

        [HO Training]
        batch size = (1536 3072)
        critic iterations = (10 30)
        labeler and antilabeler training intervals = (1 30)

        [HO Model]
        noise per gene
        depth per gene
        width per gene
        critic layers = (1024 512) (512 256) (256 128) ; i.e first layer can have 1024 to 512 neurons, second layer can have 512 to 256 neurons, third layer can have 256 or 128 neurons
        labeler layers = (1024 512) (512 256) (256 128) ; i.e first layer can have 1024 to 512 neurons, second layer can have 512 to 256 neurons, third layer can have 256 or 128 neurons
        lambda = (5 15) ; regularization hyper-parameter for gradient penalty

        [HO Optimizer]
        ; coefficients used for computing running averages of gradient and its square
        beta1 = (0.3 0.7)
        beta2 = (0.9 0.9999)

        [HO Learning Rate]
        generator initial = (1e-2 1e-3)
        generator final
        critic initial = (1e-2 1e-3)
        critic final
        labeler = (1e-3 1e-5)
        antilabeler = (1e-3 1e-5)

    [CC Model]
    type = GAN ; Non-conditional single-cell RNA-seq GAN
    generator layers = 224 752 912
    latent dim = 64 ; noise vector dimensions
    library size = 1_000 ; UMI count (hardcoded to None in the code)
    checkpoint = gan_hyperopt/best_trial/checkpoints/step_200000.pth ; set value to use a trained model

    [Generation]
    number of cells to generate = 10_000
    generation path = ${EXPERIMENT:output directory}/generated/simulated.h5ad ; will save to [Experiment]/output directory/simulated.h5ad if left undefined

    [Evaluation]
    simulated data path ; will use [Generation]/generation path if left undefined
    plot umap = True ; Note: has to be true in order to run miLISI
    compute euclidean distance = True
    compute cosine distance = True 
    compute rf auroc = True
    compute MMD = True
    compute miLISI = True ; plot tsne has to be True for this to work
    
    [GRN Benchmarking]
    grn to benchmark = ${EXPERIMENT:output directory}/generated/simulated-grn.csv
    ground truth save path = ${EXPERIMENT:output directory}/generated/
    plots save path = ${EXPERIMENT:output directory}/generated/
    compute precision at k = True
    k = 15
    compute pr = True
