; Configuration of the runs of the original implementation (upstream/), which has its own config format: no environment
; interpolation and no `compile modules`. profile-memory-upstream.py fills in the placeholders written as a dollar sign and a braced name from the environment
; (OUT_DIR, DATA_DIR, CAUSAL_GRAPH, NUM_GENES, BATCH_SIZE, DEPTH, WIDTH, NOISE) and writes the result to the output
; directory. Everything else is the setting of publication2/causal_gan.cfg.

[EXPERIMENT]
output directory = results/g1000/upstream
device = cuda
checkpoint ; set value to use a trained model
random seed = 781759803

    [Preprocessing]
    library size = 20_000 ; library size used for library-size normalization

    [Data]
    train = ../target-gene-num/data/processed/1000/train.h5ad
    validation = ../target-gene-num/data/processed/1000/validation.h5ad
    test = ../target-gene-num/data/processed/1000/test.h5ad
    number of genes = 2000
    causal graph = ../target-gene-num/data/processed/1000/causal_graph.pkl

    [Model]
    type = causal GAN
    noise per gene = 1
    depth per gene = 2
    width per gene = 1
    critic layers = 1024 512 256
    labeler layers = 2000 2000 2000
    latent dim = 128 ; noise vector dimensions
    lambda = 10 ; regularization hyper-parameter for gradient penalty

    [Training]
    batch size = 1024
    critic iterations = 5 ; iterations to train the critic for each iteration of the generator
    maximum steps = 20
    labeler and antilabeler training intervals = 1

        [Optimizer]
        beta1 = 0.5
        beta2 = 0.9

        [Learning Rate]
        generator initial = 0.001
        generator final = 0.0001
        critic initial = 0.001
        critic final = 0.001
        labeler = 0.0001
        antilabeler = 0.0001

        [Logging]
        ; Nothing is logged or saved within the 20 steps
        summary frequency = 5_000
        plot frequency = 10_000
        save frequency = 10_000

    [CC Model]
    type = GAN ; Non-conditional single-cell RNA-seq GAN (the causal controller)
    generator layers = 256 512 1024
    critic layers = 1024 512 256
    latent dim = 128 ; noise vector dimensions
    lambda = 10 ; regularization hyper-parameter for gradient penalty

    [CC Training]
    batch size = 128
    critic iterations = 5 ; iterations to train the critic for each iteration of the generator
    maximum steps = 20

        [CC Optimizer]
        beta1 = 0.5
        beta2 = 0.9

        [CC Learning Rate]
        generator initial = 0.0001
        generator final = 0.00001
        critic initial = 0.0001
        critic final = 0.00001

        [CC Logging]
        ; The controller is saved at its last step, the generator phase loads that checkpoint
        summary frequency = 5_000
        plot frequency = 50_000
        save frequency = 20
