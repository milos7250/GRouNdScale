; Shared configuration of all publication2 memory-profiling runs.
;
; Paths are relative to the experiment directory the job is started from (tf-k, target-gene-num). Values written
; as ${NAME} come from the environment, set by the run.sh of the experiment or by profile-memory.py:
;   OUT_DIR, DATA_DIR, CAUSAL_GRAPH   inputs and outputs of one run (set by run.sh)
;   COMPILE_MODULES                   True (compiled sparse model) or False (un-compiled sparse model) (set by run.sh)
;   NUM_GENES                         number of columns of the training data (derived by profile-memory.py)
;   BATCH_SIZE, DEPTH, WIDTH, NOISE   B, d, w and n of the causal generator (defaults in profile-memory.py)
; F, G and k are not configured: they are the properties of the causal graph in ${CAUSAL_GRAPH}.

[EXPERIMENT]
output directory = ${OUT_DIR}
device = cuda
checkpoint ; set value to use a trained model
random seed = 781759803
compile modules = ${COMPILE_MODULES}

    [Preprocessing]
    library size = 20_000 ; library size used for library-size normalization

    [Data]
    train = ${DATA_DIR}/train.h5ad
    validation = ${DATA_DIR}/validation.h5ad
    test = ${DATA_DIR}/test.h5ad
    number of genes = ${NUM_GENES}
    causal graph = ${CAUSAL_GRAPH}

    [Model]
    type = causal GAN
    noise per gene = ${NOISE}
    depth per gene = ${DEPTH}
    width per gene = ${WIDTH}
    critic layers = 1024 512 256
    labeler layers = 2000 2000 2000
    latent dim = 128 ; noise vector dimensions
    lambda = 10 ; regularization hyper-parameter for gradient penalty


    [Training]
    batch size = ${BATCH_SIZE}
    critic iterations = 5 ; iterations to train the critic for each iteration of the generator
    maximum steps = 20
    labeler and antilabeler training intervals = 1

        [Optimizer]
        ; coefficients used for computing running averages of gradient and its square
        beta1 = 0.5
        beta2 = 0.9

        [Learning Rate]
        generator initial = 0.001
        generator final = 0.0001
        critic initial = 0.001
        critic final = 0.001
        labeler = 0.0001
        antilabeler = 0.0001


        [Logging]
        ; Evaluation hooks only run at the last step, after the measured window has closed.
        summary frequency = 5_000
        plot frequency = 10_000
        save frequency = 10_000
        rf auroc frequency = 5_000

    [CC Model]
    type = GAN ; Non-conditional single-cell RNA-seq GAN (the causal controller)
    generator layers = 256 512 1024
    critic layers = 1024 512 256
    latent dim = 128 ; noise vector dimensions
    lambda = 10 ; regularization hyper-parameter for gradient penalty


    [CC Training]
    batch size = 128
    critic iterations = 5 ; iterations to train the critic for each iteration of the generator
    maximum steps = 20

        [CC Optimizer]
        ; coefficients used for computing running averages of gradient and its square
        beta1 = 0.5
        beta2 = 0.9

        [CC Learning Rate]
        generator initial = 0.0001
        generator final = 0.00001
        critic initial = 0.0001
        critic final = 0.00001

        [CC Logging]
        summary frequency = 5_000
        plot frequency = 50_000
        save frequency = 50_000
        rf auroc frequency = 5_000
